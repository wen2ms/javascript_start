<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comment</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .wrapper {
        min-width: 400px;
        max-width: 800px;
        display: flex;
        justify-content: flex-end;
      }

      .avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        overflow: hidden;
        background: url(images/avatar-1.svg) no-repeat center / cover;
        margin-right: 20px;
      }

      .wrapper textarea {
        outline: none;
        border-color: transparent;
        resize: none;
        background: #f5f5f5;
        border-radius: 4px;
        flex: 1;
        padding: 10px;
        transition: all 0.5s;
        height: 48px;
      }

      .wrapper textarea:focus {
        border-color: #e4e4e4;
        background: #fff;
        height: 70px;
      }

      .wrapper button {
        background: #00aeec;
        color: #fff;
        border: none;
        border-radius: 4px;
        margin-left: 10px;
        width: 70px;
        cursor: pointer;
      }

      .wrapper .total {
        margin-right: 80px;
        color: #999;
        margin-top: 5px;
        opacity: 0;
        transition: all 0.5s;
      }

      .list {
        min-width: 400px;
        max-width: 800px;
      }

      .list .item {
        width: 100%;
        display: flex;
      }

      .list .item .info {
        flex: 1;
        border-bottom: 2px dashed #e4e4e4;
        padding-bottom: 10px;
      }

      .list .item .name {
        color: #fb7299;
        font-size: 14px;
        font-weight: 700;
      }

      .list .item .text {
        color: #333;
        padding: 10px 0;
      }

      .list .item .time {
        color: #999;
        font-size: 12px;
      }
    </style>
    <body>
      <div class="wrapper">
        <i class="avatar"></i>
        <textarea name="" id="comment-input" placeholder="Write a friendly comment" rows="2" maxlength="200"></textarea>
        <button>Post</button>
      </div>
      <div class="wrapper">
        <span class="total">0/200 characters</span>
      </div>
      <div class="list">
        <div class="item" style="display: none">
          <i class="avatar"></i>
          <div class="info">
            <p class="name">Alex Green</p>
            <p class="text">Thank you all for your hard work. We did it together![Laugh][Like]</p>
            <p class="time">2022-10-10 20:29:21</p>
          </div>
        </div>
      </div>
      <script>
        const commentInput = document.querySelector("#comment-input")
        const total = document.querySelector(".total")
        const item = document.querySelector(".item")
        const text = document.querySelector(".text")
        commentInput.addEventListener("focus", function () {
          total.style.opacity = 1
        })
        commentInput.addEventListener("blur", function () {
          total.style.opacity = 0
        })
        commentInput.addEventListener("input", function () {
          total.innerHTML = `${commentInput.value.length}/200 characters`
        })
        commentInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            event.preventDefault()
            if (commentInput.value.trim()) {
              item.style.display = "block"
              text.textContent = commentInput.value
            }
            commentInput.value = ""
            total.innerHTML = "0/200 characters"
          }
        })
        const postButton = document.querySelector(".wrapper button")
        postButton.addEventListener("click", function () {
          commentInput.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }))
        })
      </script>
    </body>
  </head>
</html>
