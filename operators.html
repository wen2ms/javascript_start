<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operators</title>
  </head>
  <body>
    <script>
      console.log(3 > 5)
      console.log(2 == "2")
      console.log(2 === "2")
      console.log(NaN === NaN)
      console.log(2 != "2")
      console.log(2 !== "2")
      //   &&, ||, !
      let num = +prompt("Enter a number")
      alert(num % 4 === 0 && num % 100 !== 0)
    </script>
  </body>
</html>
