<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quarterly report</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .box {
        display: flex;
        width: 700px;
        height: 300px;
        border-left: 2px solid pink;
        border-bottom: 2px solid pink;
        margin: 50px auto;
        justify-content: space-around;
        align-items: flex-end;
        text-align: center;
      }

      .box > div {
        display: flex;
        width: 50px;
        background-color: pink;
        flex-direction: column;
        justify-content: space-between;
      }

      .box div span {
        margin-top: -20px;
      }

      .box div h4 {
        margin-bottom: -35px;
        width: 70px;
        margin-left: -10px;
      }
    </style>
  </head>
  <body>
    <script>
      let arr = []
      for (let i = 0; i < 4; ++i) {
        arr.push(prompt(`Please input ${i} quarterly number`))
      }
      document.write(`<div class="box">`)
      for (let i = 0; i < 4; ++i) {
        document.write(`
        <div style="height: ${arr[i]}px">
        <span>${arr[i]}</span>
        <h4>Quarter ${i + 1}</h4>
      </div>`)
      }
      document.write(`</div>`)
    </script>
  </body>
</html>
