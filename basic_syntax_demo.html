<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic syntax practice</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      h2 {
        text-align: center;
      }

      table {
        border-collapse: collapse;
        height: 80px;
        margin: 0 auto;
        text-align: center;
      }

      th {
        padding: 5px 30px;
      }

      table,
      th,
      td {
        border: 1px solid #000;
      }
    </style>
  </head>
  <body>
    <h2>Order</h2>
    <script>
      let price = +prompt("Enter the product price")
      let products_count = +prompt("Enter the number of product")
      let address = prompt("Enter the address")
      let total_price = price * products_count
      document.write(`
    <table>
      <thead>
        <tr>
          <th>Product name</th>
          <th>Product price</th>
          <th>Product count</th>
          <th>Total price</th>
          <th>Address</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Foo Pro</td>
          <td>${price}</td>
          <td>${products_count}</td>
          <td>${total_price}</td>
          <td>${address}</td>
        </tr>
      </tbody>
    </table>`)
    </script>
  </body>
</html>
