<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Closure</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f1f5f9;
        font-family: Arial, Helvetica, sans-serif;
      }

      .atm {
        width: 380px;
        padding: 30px;
        background-color: #fff;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        text-align: center;
        font-size: 24px;
        margin-bottom: 25px;
      }

      .balance-card {
        padding: 25px;
        text-align: center;
        background-color: #eff6ff;
        border-radius: 12px;
        margin-bottom: 25px;
      }

      .balance-label {
        font-size: 14px;
        color: #64748b;
      }

      .balance-amount {
        margin-top: 10px;
        font-size: 32px;
        font-weight: 700;
        color: green;
      }

      .amount-input {
        width: 100%;
        padding: 12px;
        border: 2px solid #cbd5e1;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
      }

      .amount-input:focus {
        border-color: #3b82f6;
      }

      .buttons {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }

      button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        background-color: #e2e8f0;
      }

      button:hover {
        opacity: 0.8;
      }

      .deposit-btn {
        background-color: #16a34a;
        color: #fff;
      }

      .withdraw-btn {
        background-color: #2563eb;
        color: #fff;
      }

      .reset-btn {
        background-color: #fee2e2;
        color: #b91c1c;
      }

      .history {
        margin-top: 25px;
      }

      .history h2 {
        font-size: 16px;
        margin-bottom: 10px;
      }

      .history-list {
        min-height: 100px;
        max-height: 180px;
        overflow-y: auto;
        padding: 15px;
        background-color: #f8fafc;
        border-radius: 8px;
        list-style: none;
      }

      .history-list li {
        font-size: 13px;
        color: #475569;
        padding: 6px 0;
        border-bottom: 1px solid #e2e8f0;
      }
    </style>
  </head>
  <body>
    <div class="atm">
      <h1>ATM Bank Account</h1>
      <div class="balance-card">
        <p class="balance-label">Current Balance</p>
        <p class="balance-amount" id="balance">$1000.00</p>
      </div>
      <input type="number" class="amount-input" id="amount" min="0.01" step="0.01" placeholder="Enter amount" />
      <div class="buttons">
        <button class="deposit-btn" id="deposit-btn">Deposit</button>
        <button class="withdraw-btn" id="withdraw-btn">Withdraw</button>
        <button class="reset-btn" id="reset-btn">Reset</button>
      </div>
      <div class="history">
        <h2>Transaction History</h2>
        <ul class="history-list" id="history-list"></ul>
      </div>
    </div>
    <script>
      function createAccount(initialBalance = 0) {
        let balance = initialBalance
        function deposit(amount) {
          if (!Number.isFinite(amount) || amount <= 0) {
            return false
          }
          balance += amount
          return true
        }
        function withdraw(amount) {
          if (!Number.isFinite(amount) || amount <= 0 || amount > balance) {
            return false
          }
          balance -= amount
          return true
        }
        function getBalance() {
          return balance
        }
        function reset() {
          balance = initialBalance
        }

        return {
          deposit,
          withdraw,
          getBalance,
          reset,
        }
      }
      const account = createAccount(1000)
      const balanceElement = document.querySelector("#balance")
      const amountInput = document.querySelector("#amount")
      const historyList = document.querySelector("#history-list")

      function updateBalance() {
        balanceElement.textContent = `$${account.getBalance().toFixed(2)}`
      }
      function addHistory(message) {
        const li = document.createElement("li")
        li.textContent = message
        historyList.prepend(li)
      }
      function getAmount() {
        const value = amountInput.value.trim()
        if (value === "") {
          return NaN
        }
        return Number(value)
      }
      document.querySelector("#deposit-btn").addEventListener("click", () => {
        const amount = getAmount()
        if (account.deposit(amount)) {
          updateBalance()
          addHistory(`Deposit ¥${amount.toFixed(2)}`)
          amountInput.value = ""
        } else {
          alert("Please enter a valid amount.")
        }
      })

      document.querySelector("#withdraw-btn").addEventListener("click", () => {
        const amount = getAmount()
        if (account.withdraw(amount)) {
          updateBalance()
          addHistory(`Withdraw ¥${amount.toFixed(2)}`)
          amountInput.value = ""
        } else {
          alert("Invalid amount or insufficient balance.")
        }
      })
      document.querySelector("#reset-btn").addEventListener("click", () => {
        account.reset()
        updateBalance()
        addHistory("Account reset")
        amountInput.value = ""
      })

      updateBalance()
      addHistory("Account created with $1000.00")
    </script>
  </body>
</html>
