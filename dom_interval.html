<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interval</title>
  </head>
  <body>
    <script>
      let intervalId = setInterval(function () {
        document.write("1<br>")
      }, 1000)
      clearInterval(intervalId)
    </script>
  </body>
</html>
