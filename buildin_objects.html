<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Build in objects</title>
  </head>
  <body>
    <script>
      document.write(Math.PI)
      document.write(`<br>${Math.ceil(1.34)}`)
      document.write(`<br>${Math.floor(1.34)}`)
      document.write(`<br>${Math.round(1.5)}`)
      document.write(`<br>${Math.round(-1.5)}`)
      document.write(`<br>${Math.round(-1.51)}`)
      let nums = [1, 2, 3, 4, 5]
      let random_index = Math.floor(Math.random() * nums.length)
      document.write(`<br>${nums[random_index]}`)
      function getRandom(start, end) {
        return Math.floor(Math.random() * (end - start + 1) + start)
      }
      random_num = getRandom(3, 5)
      document.write(`<br>${random_num}`)
    </script>
  </body>
</html>
