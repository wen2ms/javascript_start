<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .slider {
        width: 560px;
        height: 400px;
        overflow: hidden;
      }

      .slider-wrapper {
        width: 100%;
        height: 320px;
      }

      .slider-wrapper img {
        width: 100%;
        height: 100%;
        display: block;
      }

      .slider-footer {
        height: 80px;
        background-color: rgb(100 67 68);
        padding: 12px 12px 0 12px;
        position: relative;
      }

      .slider-footer .toggle {
        position: absolute;
        right: 0;
        top: 12px;
        display: flex;
      }

      .slider-footer .toggle button {
        margin-right: 12px;
        width: 28px;
        height: 28px;
        appearance: none;
        border: none;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border-radius: 4px;
        cursor: pointer;
      }

      .slider-footer .toggle button:hover {
        background-color: rgba(255, 255, 255, 0.2);
      }

      .slider-footer p {
        color: #fff;
        font-size: 18px;
        margin-bottom: 10px;
      }

      .slider-indicator {
        list-style: none;
        display: flex;
        align-items: center;
      }

      .slider-indicator li {
        width: 8px;
        height: 8px;
        margin: 4px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.4;
        cursor: pointer;
      }

      .slider-indicator li.active {
        width: 12px;
        height: 12px;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="slider">
      <div class="slider-wrapper">
        <img src="images/slider01.svg" alt="" />
      </div>
      <div class="slider-footer">
        <p>Sunrise Ridge</p>
        <ul class="slider-indicator">
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
        </ul>
        <div class="toggle">
          <button class="prev">&lt;</button>
          <button class="next">&gt;</button>
        </div>
      </div>
    </div>
    <script>
      const slides = [
        { url: "images/slider01.svg", title: "Sunrise Ridge", color: "#345f60" },
        { url: "images/slider02.svg", title: "Blue Lake", color: "#36566f" },
        { url: "images/slider03.svg", title: "Desert Sunset", color: "#68566f" },
        { url: "images/slider04.svg", title: "Forest Valley", color: "#315f58" },
        { url: "images/slider05.svg", title: "Lavender Hills", color: "#55557e" },
        { url: "images/slider06.svg", title: "Golden Dunes", color: "#7a7652" },
        { url: "images/slider07.svg", title: "Ocean Cliffs", color: "#426975" },
        { url: "images/slider08.svg", title: "Alpine Escape", color: "#577657" },
      ]
      const randomIndex = parseInt(Math.random() * slides.length)
      const img = document.querySelector(".slider-wrapper img")
      img.src = slides[randomIndex].url
      const title = document.querySelector(".slider-footer p")
      title.innerHTML = slides[randomIndex].title
      const sliderFooter = document.querySelector(".slider-footer")
      sliderFooter.style.backgroundColor = slides[randomIndex].color
      const activeLi = document.querySelector(`.slider-indicator li:nth-child(${randomIndex + 1})`)
      activeLi.classList.add("active")
    </script>
  </body>
</html>
